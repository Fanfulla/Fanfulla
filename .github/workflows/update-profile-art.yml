name: Update profile art

# Re-reads the live star and download counts and re-renders the shipped card
# once a day. The portrait and the info card are static -- they are only
# rebuilt by hand when the photo or the content changes.

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC, off the hour to dodge the cron rush
  workflow_dispatch:

permissions:
  contents: write          # the only permission this needs

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch shipped metrics
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}   # read-only, raises the API rate limit
        run: python scripts/fetch_shipped.py

      - name: Render shipped card
        run: python scripts/render_shipped_svg.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shipped.json shipped-card.svg
          git diff --staged --quiet || git commit -m "chore: refresh shipped card"
          git push

name: Update profile art

# Re-scrapes the public contribution calendar and re-renders the heatmap once a
# day. The portrait and the info card are static -- they are only rebuilt by
# hand when the photo or the content changes.

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC, off the hour to dodge the cron rush
  workflow_dispatch:

permissions:
  contents: write          # the only permission this needs

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          git diff --staged --quiet || git commit -m "chore: refresh contribution graph"
          git push
